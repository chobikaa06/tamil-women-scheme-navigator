<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>தோழி - அரசு திட்ட உதவி</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#12363a;--panel:#1b4a4f;--ink:#fff7e6;--gold:#ffb627;--rose:#e85d75}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Tamil',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center}
main{width:100%;max-width:640px;padding:20px 16px 40px;display:flex;flex-direction:column;gap:18px}
h1{font-size:2rem;margin:8px 0 0;font-weight:800}
.sub{margin:0;font-size:1.15rem;opacity:.9}
#mic{align-self:center;width:170px;height:170px;border-radius:50%;border:0;background:var(--gold);color:#12363a;font:800 1.2rem 'Noto Sans Tamil';cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 0 0 12px rgba(255,182,39,.2)}
#mic svg{width:64px;height:64px}
#mic.on{background:var(--rose);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 26px rgba(232,93,117,.15)}}
@media (prefers-reduced-motion:reduce){#mic.on{animation:none}}
#mic:focus-visible,button:focus-visible,input:focus-visible{outline:4px solid #fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles button{background:var(--panel);color:var(--ink);border:2px solid #2d6a70;border-radius:14px;padding:14px 10px;font:700 1.05rem 'Noto Sans Tamil';cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center}
.tiles span{font-size:1.8rem}
#chat{display:flex;flex-direction:column;gap:10px}
.msg{padding:14px 16px;border-radius:16px;font-size:1.2rem;line-height:1.7;max-width:92%}
.bot{background:var(--panel);align-self:flex-start;border-bottom-left-radius:4px}
.me{background:var(--gold);color:#12363a;align-self:flex-end;border-bottom-right-radius:4px;font-weight:700}
.replay{display:block;margin-top:8px;background:none;border:2px solid var(--gold);color:var(--gold);border-radius:20px;padding:6px 14px;font:700 .95rem 'Noto Sans Tamil';cursor:pointer}
form{display:flex;gap:8px}
input{flex:1;padding:14px;border-radius:12px;border:0;font:1.1rem 'Noto Sans Tamil'}
form button{background:var(--rose);color:#fff;border:0;border-radius:12px;padding:0 18px;font:700 1.1rem 'Noto Sans Tamil'}
.note{font-size:.95rem;opacity:.8}
</style>
</head>
<body>
<main>
  <div>
    <h1>தோழி</h1>
    <p class="sub">அரசு திட்டங்களை உங்கள் மொழியில் சொல்கிறேன். பெரிய பொத்தானை அழுத்தி பேசுங்கள்.</p>
  </div>
  <button id="mic" aria-label="பேச அழுத்தவும்">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2Z"/></svg>
    <span id="miclabel">பேசுங்கள்</span>
  </button>
  <div class="tiles" id="tiles"></div>
  <div id="chat" aria-live="polite"></div>
  <form id="f"><input id="t" placeholder="அல்லது இங்கே தட்டச்சு செய்யுங்கள்"><button>அனுப்பு</button></form>
  <p class="note">இது ஒரு வழிகாட்டி மட்டுமே. உறுதிப்படுத்த அருகிலுள்ள அலுவலகத்தில் கேளுங்கள். பெண்கள் உதவி எண்: 181</p>
</main>
<script>
const TOPICS=[["🔥","இலவச எரிவாயு இணைப்பு வேண்டும்"],["🤰","கர்ப்ப காலத்தில் அரசு பண உதவி என்ன?"],["👧","பெண் குழந்தைக்கு சேமிப்புத் திட்டம் என்ன?"],["🧵","இலவசமாக தொழில் கற்றுக்கொள்ள வேண்டும்"],["🍚","ரேஷன் அட்டை எப்படி வாங்குவது?"],["❓","எனக்கு எந்த திட்டம் பொருந்தும் என்று தெரியவில்லை"]];
const tiles=document.getElementById('tiles'),chat=document.getElementById('chat'),mic=document.getElementById('mic'),label=document.getElementById('miclabel');
let history=[],rec=null,listening=false;
TOPICS.forEach(([e,t])=>{const b=document.createElement('button');b.innerHTML=`<span>${e}</span>${t}`;b.onclick=()=>send(t);tiles.appendChild(b)});

function speak(text){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='ta-IN';u.rate=.9;
  const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ta'));if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function add(cls,text){
  const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;
  if(cls==='bot'){const b=document.createElement('button');b.className='replay';b.textContent='🔊 மீண்டும் கேளுங்கள்';b.onclick=()=>speak(text);d.appendChild(b)}
  chat.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'});return d;
}
async function send(text){
  text=text.trim();if(!text)return;
  add('me',text);history.push({role:'user',text});
  const wait=add('bot','யோசிக்கிறேன்...');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
    const d=await r.json();
    if(!d.reply)throw new Error(d.error);
    wait.remove();history.push({role:'model',text:d.reply});add('bot',d.reply);speak(d.reply);
  }}catch(e){wait.remove();add('bot','Error: '+e.message)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  rec=new SR();rec.lang='ta-IN';rec.interimResults=false;
  rec.onresult=e=>send(e.results[0][0].transcript);
  rec.onend=()=>{listening=false;mic.classList.remove('on');label.textContent='பேசுங்கள்'};
  rec.onerror=()=>{listening=false;mic.classList.remove('on');label.textContent='பேசுங்கள்'};
}
mic.onclick=()=>{
  if(!rec){add('bot','இந்த உலாவியில் குரல் வசதி இல்லை. Chrome பயன்படுத்தவும் அல்லது கீழே தட்டச்சு செய்யவும்.');return}
  speechSynthesis.cancel();
  if(listening){rec.stop();return}
  listening=true;mic.classList.add('on');label.textContent='கேட்கிறேன்...';rec.start();
};
document.getElementById('f').onsubmit=e=>{e.preventDefault();const i=document.getElementById('t');send(i.value);i.value=''};
add('bot','வணக்கம் அக்கா! நான் தோழி. உங்களுக்கு என்ன உதவி வேண்டும்? பொத்தானை அழுத்தி சொல்லுங்கள், அல்லது கீழே உள்ள படங்களில் ஒன்றைத் தொடுங்கள்.');
speechSynthesis&&speechSynthesis.getVoices();
</script>
</body>
</html>
